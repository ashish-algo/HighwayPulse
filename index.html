<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HighwayPulse — Highway Defect Prioritization & Maintenance Planning Dashboard</title>
  <meta name="description" content="An operational engineering dashboard for logging, evaluating, and planning highway defect repairs with transparent heuristic scoring and geographic tracking." />

  <!-- Master Design System & Responsive Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- External CDN Libraries (Leaflet & Chart.js) with Fallback Handling -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- 
       HIGHWAYPULSE — MODULAR APPLICATION SHELL
      
       NOTE FOR DEVELOPERS & STUDENTS:
       To ensure maximum code clarity and readability, the application views
       and UI components are partitioned into separate files inside /templates:
         - templates/sidebar.html       : Navigation drawer, links, & brand header
         - templates/topbar.html        : Sticky header, search bar, & theme toggle
         - templates/view-overview.html : KPI cards, urgent repair queue, shortcuts
         - templates/view-map.html      : Leaflet GIS map with highway corridor pills
         - templates/view-defects.html  : Defect table, search, & multi-filter tools
         - templates/view-report.html   : Intake wizard with real-time score preview
         - templates/view-planner.html  : Maintenance work order Kanban board & crew
         - templates/view-analytics.html: Statistical charts, risk matrix, & trends
         - templates/view-settings.html : User preferences, weights, & data backup
         - templates/view-about.html    : Engineering formulas & architecture guide
         - templates/modals.html        : Defect inspector & work order dialogs
       -->
  <div class="app-container">
    <!-- Sidebar Navigation Drawer (Loaded from templates/sidebar.html) -->
    <div id="sidebar-container"></div>

    <!-- Mobile Drawer Overlay Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main Content Application Shell -->
    <div class="main-wrapper main-content" id="main-wrapper">
      <!-- Topbar Header (Loaded from templates/topbar.html) -->
      <div id="topbar-container"></div>

      <!-- Main Application Views (Loaded from templates/view-*.html) -->
      <main class="content-area page-body" id="app-stage"></main>
    </div>
  </div>

  <!-- Application Modal Overlays (Loaded from templates/modals.html) -->
  <div id="modals-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- 
       Vanilla JavaScript Modules Loaded in Strict Dependency Order
       Each module has its own dedicated file and top documentation comment:
         - js/utils.js     : Formatting, math, date, and toast utilities
         - js/priority.js  : Transparent heuristic calculation engine
         - js/data.js      : Sample highway defect seed datasets
         - js/storage.js   : LocalStorage persistence & import/export
         - js/templates.js : Modular template loader & component registry
         - js/dashboard.js : Executive summary & KPI metric cards
         - js/defects.js   : Defect directory table, filtering & sorting
         - js/map.js       : Interactive Leaflet GIS highway map controller
         - js/planner.js   : Maintenance scheduler & work order management
         - js/analytics.js : Chart.js visualization engine
         - js/form.js      : Defect intake wizard & live formula preview
         - js/settings.js  : System preferences & algorithm weight sliders
         - js/app.js       : Core SPA router & bootstrap coordinator
        -->
  <script src="js/utils.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/defects.js"></script>
  <script src="js/map.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/form.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
